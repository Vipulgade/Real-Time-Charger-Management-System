name: Spring Boot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot App
        run: cd ev-charger-mangement && mvn clean package -DskipTests=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ev-charger-app
          path: ev-charger-mangement/target/*.jar
